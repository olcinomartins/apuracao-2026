<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef0f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Apuração Presidente 2026</title>
<meta name="description" content="Apuração para Presidente 2026 (Flávio Bolsonaro x Lula): mapa por estado, projeção ponderada pelo eleitorado e histórico da contagem.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://raw.githubusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='13' height='14' rx='2' fill='%232a62c9'/%3E%3Crect x='16' y='9' width='13' height='14' rx='2' fill='%23d03a2f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=20261025182131">
<script src="app.js?v=20261025182131" defer></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-lupa" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m20 20-4.2-4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-filtro" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-seta" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-limpar" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-esq" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-dir" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>

<header class="barra">
  <div class="barra-in">
    <p class="marca" translate="no">Apuração <span>2026</span></p>
    <div class="seg seg-modo" role="tablist" aria-label="Visão">
      <button type="button" role="tab" data-modo="geral" aria-controls="carrossel">Geral</button>
      <button type="button" role="tab" data-modo="regiao" aria-controls="carrossel">Por região</button>
    </div>
    <div class="acoes-dir">
      <button id="btn-limpar" class="btn-filtro btn-limpar" type="button" aria-label="Limpar filtro e voltar para Brasil" disabled>
        <svg aria-hidden="true"><use href="#i-limpar"/></svg><span>Limpar</span>
      </button>
      <button id="btn-filtro" class="btn-filtro" type="button" aria-expanded="false" aria-controls="filtros" aria-label="Filtrar local e tema">
        <svg aria-hidden="true"><use href="#i-filtro"/></svg><span>Filtro</span>
      </button>
    </div>
  </div>
  <section id="filtros" class="filtros" aria-label="Filtros" hidden>
    <div class="filtros-in">
      <div class="filtro"><span class="rotulo" id="rot-regiao">Região</span><div class="combo" id="cb-regiao" data-label="rot-regiao"></div></div>
      <div class="filtro"><span class="rotulo" id="rot-uf">Estado</span><div class="combo" id="cb-uf" data-label="rot-uf"></div></div>
      <div class="filtro"><span class="rotulo" id="rot-mun">Município</span><div class="combo" id="cb-mun" data-label="rot-mun"></div></div>
      <div class="filtros-pe">
        <button id="tema" class="btn-texto" type="button">Tema claro/escuro</button>
        <button id="fechar-filtro" class="btn-prim" type="button">Ver resultado</button>
      </div>
    </div>
  </section>
</header>

<main id="conteudo">
  <p id="aviso-teste" class="aviso" hidden>Modo teste: dados sintéticos gerados a partir do 1º turno.</p>

  <div class="cab">
    <div class="cab-txt">
      <h1 id="titulo-local">Brasil</h1>
      <p id="status" class="status" aria-live="polite">Carregando…</p>
    </div>
    <nav class="abas" aria-label="Telas do carrossel">
      <button type="button" data-ir="0" aria-current="true">Apuração</button>
      <button type="button" data-ir="1">Projeção</button>
      <button type="button" data-ir="2">Histórico</button>
    </nav>
    <div class="seg seg-turno" role="tablist" aria-label="Turno">
      <button type="button" role="tab" data-turno="t1">1º turno</button>
      <button type="button" role="tab" data-turno="t2">2º turno</button>
    </div>
  </div>

  <div class="carrossel-wrap">
    <button class="nav-seta esq" type="button" data-passo="-1" aria-label="Tela anterior"><svg aria-hidden="true"><use href="#i-esq"/></svg></button>
    <div id="carrossel" class="carrossel" tabindex="0" aria-roledescription="carrossel" aria-label="Resultados">
      <section class="slide" id="s0" aria-label="Apuração"></section>
      <section class="slide" id="s1" aria-label="Projeção"></section>
      <section class="slide" id="s2" aria-label="Histórico"></section>
    </div>
    <button class="nav-seta dir" type="button" data-passo="1" aria-label="Próxima tela"><svg aria-hidden="true"><use href="#i-dir"/></svg></button>
  </div>
  <p class="rodape">Fonte: TSE · atualizado <span id="rod-atual">–</span> · totalização TSE <span id="rod-tse">–</span> · pode haver atraso de alguns minutos; projeções são estimativas não oficiais</p>
</main>
</body>
</html>
